name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import all pipeline modules
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import importlib
          modules = [
              'scraper',
              'biorxiv_scraper',
              'pubmed_scraper',
              'youtube_scraper',
              'drafter',
              'single_page_generator',
              'image_generator',
              'pdf_generator',
              'http_utils',
          ]
          for m in modules:
              importlib.import_module(m)
              print(f'ok: {m}')
          "

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          if [ -d tests ] && [ "$(ls -A tests 2>/dev/null | grep -E '^test_.*\.py$' || true)" ]; then
            pytest tests/ -v
          else
            echo "No tests found — skipping pytest."
          fi
